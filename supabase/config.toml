# Supabase Configuration for OUTPOST Smart Student Accommodation Platform
project_id = "outpost-accommodation"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
port = 54324
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
port = 54323
file_size_limit = "10MiB"

[realtime]
enabled = true
port = 54325
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_role = "anon"

[edge_runtime]
enabled = true
port = 54326
policy = "per_worker"
inspector_port = 8083
